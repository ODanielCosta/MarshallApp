    <style>
        body{
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            color: var(--app-ink);
            background: var(--app-surface);
            height: 100%;
        }
        select, button{
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            padding: 5px;
        }
        .bg{
            height: 100vh;
            position: fixed;
            opacity: 35%;
        }
        main{
            z-index: 99;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px 12px;
        }
        .logo{
            width: 190px;
        }
        .app-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 12px;
            z-index: 2;
        }
        .app-header .logo { display: block; width: 120px; height: auto; }
        .active-mode {
            padding: 6px 10px;
            border: 1px solid #1e385940;
            border-radius: 20px;
            background: #ffffffcc;
            color: var(--brand-navy);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .menu-toggle {
            display: grid;
            place-items: center;
            flex: 0 0 44px;
            height: 44px;
            padding: 0;
            border: 1px solid var(--brand-navy);
            border-radius: 14px;
            background: #fffffff0;
            color: var(--brand-navy);
            box-shadow: 0 3px 10px #1e385914;
            cursor: pointer;
            touch-action: manipulation;
        }
        .menu-toggle svg { width: 22px; height: 22px; }
        .mode-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            box-sizing: border-box;
            width: min(290px, 100%);
            padding: 8px;
            border: 1px solid #1e38594d;
            border-radius: 18px;
            background: #fffffffA;
            box-shadow: 0 12px 32px #1e385933;
        }
        .mode-menu p {
            margin: 8px 10px;
            color: var(--app-muted);
            font-size: 12px;
        }
        .mode-option {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 10px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: var(--brand-navy);
            text-align: left;
            cursor: pointer;
            touch-action: manipulation;
        }
        .mode-option[aria-pressed="true"] { background: var(--app-soft); }
        .mode-option strong, .mode-option small { display: block; }
        .mode-option strong { font-size: 14px; font-weight: 600; }
        .mode-option small { margin-top: 3px; color: var(--app-muted); font-size: 11px; }
        .mode-check { width: 18px; opacity: 0; font-weight: 600; }
        .mode-option[aria-pressed="true"] .mode-check { opacity: 1; }
        .menu-toggle:focus-visible, .mode-option:focus-visible {
            outline: 3px solid var(--brand-navy);
            outline-offset: 3px;
        }
        .menu-toggle[aria-expanded="true"], .mode-option:hover { background: var(--app-soft); }
        .menu-toggle, .mode-option { -webkit-tap-highlight-color: transparent; }
        .selectors {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 16px 12px 4px;
            max-width: 420px;
        }
        .parameter {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 0;
        }
        .parameter label {
            font-size: 14px;
            font-weight: 500;
        }
        .parameter[hidden] { display: none; }
        .selectors:not(.is-shotgun) {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            max-width: none;
            margin-left: 0;
            margin-right: 0;
        }
        .selectors:not(.is-shotgun) .parameter { width: 100%; }
        .selectors:not(.is-shotgun) .swipe-selector { width: 100%; box-sizing: border-box; }
        .selectors:not(.is-shotgun) .swipe-step { flex: 0 0 44px; }
        .selectors:not(.is-shotgun) .swipe-value { flex: 1; min-width: 0; padding: 0; }
        .selectors.is-shotgun {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            width: 100%;
            max-width: 350px;
            margin-left: 0;
            margin-right: 0;
        }
        .is-shotgun .hole { grid-column: 1 / -1; width: 100%; }
        .is-shotgun .swipe-selector { width: 100%; box-sizing: border-box; }
        .is-shotgun .swipe-step { flex: 0 0 44px; }
        .is-shotgun .swipe-value { flex: 1; min-width: 0; padding: 0; }
        .shotgun-time input {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            height: 60px;
            padding: 0 10px;
            border: 1px solid var(--brand-navy);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 3px 10px #1e385914;
            color: var(--app-ink);
            font: 600 20px 'Poppins', sans-serif;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
        }
        .shotgun-time input::-webkit-date-and-time-value { text-align: center; }
        .shotgun-time input:focus-visible { outline: 3px solid var(--brand-navy); outline-offset: 3px; }
        .swipe-selector {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--brand-navy);
            border-radius: 14px;
            box-shadow: 0 3px 10px #1e385914;
            overflow: hidden;
        }
        .swipe-step {
            width: 44px;
            height: 58px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--brand-navy);
            font-size: 28px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .swipe-step:disabled {
            color: #abb7c6;
            cursor: default;
        }
        .swipe-step:active:not(:disabled) {
            background: #e1eaf6;
        }
        .swipe-value {
            display: grid;
            place-items: center;
            min-width: 68px;
            min-height: 58px;
            padding: 0 3px;
            font-size: 22px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--app-ink);
            cursor: ew-resize;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y pinch-zoom;
        }
        .swipe-value:focus-visible, .swipe-step:focus-visible {
            outline: 3px solid var(--brand-navy);
            outline-offset: -4px;
            border-radius: 8px;
        }
        .swipe-number {
            transition: transform 140ms ease-out;
        }
        .swipe-value.is-dragging {
            background: var(--app-hover);
            cursor: grabbing;
        }
        .is-dragging .swipe-number {
            transition: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .swipe-number { transition: none; }
        }
        .swipe-hint {
            margin: 4px 12px 16px;
            font-size: 12px;
            color: var(--app-muted);
            text-align: center;
        }
        .results{
            margin: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
        }
        .result-view-toggle {
            display: flex;
            box-sizing: border-box;
            width: 100%;
            gap: 4px;
            margin-top: 8px;
            padding: 3px;
            border: 1px solid #1e38594d;
            border-radius: 14px;
            background: #ffffffe8;
        }
        .result-view-toggle button {
            flex: 1;
            min-height: 44px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--brand-navy);
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }
        .result-view-toggle button[aria-pressed="true"] { background: var(--brand-navy); color: white; }
        .result-view-toggle button:focus-visible { outline: 3px solid var(--brand-navy); outline-offset: 2px; }
        .hole-progress {
            position: relative;
            isolation: isolate;
            box-sizing: border-box;
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid var(--brand-navy);
            border-radius: 14px;
            background: #fffffff0;
            box-shadow: 0 3px 10px #1e385914;
            color: var(--app-ink);
            cursor: zoom-in;
        }
        main.showing-progress .hole-progress { padding-top: 8px; margin-top: 12px; }
        .ideal-progress { position: relative; margin-top: 18px; padding-top: 8px; border-top: 1px solid #d8e2ef; }
        .ideal-progress .progress-caption { position: static; display: table; width: fit-content; max-width: 100%; margin: 0 0 6px; white-space: normal; }
        .progress-expand {
            position: absolute;
            top: -16px;
            right: -10px;
            z-index: 10;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--brand-navy);
            cursor: zoom-in;
        }
        .progress-expand::before { content: ''; position: absolute; inset: 8px; border: 1px solid var(--brand-navy); border-radius: 10px; background: var(--app-surface); box-shadow: 0 2px 6px #1e385926; }
        .progress-expand svg { position: relative; z-index: 1; width: 16px; height: 16px; }
        .progress-expand:focus-visible { outline: 3px solid var(--brand-navy); outline-offset: 3px; }
        .result-view-toggle[hidden], .hole-progress[hidden] { display: none; }
        .progress-caption {
            position: absolute;
            top: -10px;
            left: 12px;
            box-sizing: border-box;
            max-width: calc(100% - 50px);
            margin: 0;
            padding: 3px 8px;
            border: 1px solid var(--app-border);
            border-radius: 8px;
            background: var(--app-soft);
            color: var(--brand-navy);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; line-height: 1.2; }
        .progress-summary strong { font-size: 20px; }
        .progress-summary > span { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .expected-hole-number { display: inline-block; padding: 1px 6px; border-radius: 7px; background: var(--brand-navy); color: white; font: inherit; line-height: 1; font-variant-numeric: tabular-nums; }
        .expected-hole-number[hidden] { display: none; }
        .progress-track { height: 10px; margin: 10px 0 8px; border-radius: 10px; background: var(--app-track); overflow: hidden; }
        .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--brand-navy); }
        .progress-route { display: flex; align-items: center; gap: 8px; }
        .progress-route .progress-track { flex: 1; }
        .golf-icon { width: 20px; height: 24px; flex: 0 0 20px; color: var(--brand-navy); }
        .progress-interval { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; line-height: 1.3; color: var(--app-muted); }
        .pace-gap {
            --pace-background: var(--app-soft);
            --pace-border: var(--app-border);
            --pace-ink: var(--brand-navy);
            position: relative;
            isolation: isolate;
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }
        .pace-gap[data-timing="late"] {
            --pace-background: #f9dddd;
            --pace-border: #d79999;
            --pace-ink: #842c2c;
        }
        .pace-gap::before {
            content: '';
            position: absolute;
            inset: -4px -8px -4px;
            z-index: -1;
            border: 1px solid var(--pace-border);
            border-radius: 10px;
            background: var(--pace-background);
            pointer-events: none;
        }
        .gap-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; line-height: 1.3; }
        .gap-heading strong { font-size: 13px; }
        .gap-status { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; padding-right: 14px; }
        .gap-heading .gap-status strong { font-size: 12px; }
        .current-hole { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
        .current-hole-title {
            padding: 3px 8px;
            border: 1px solid var(--pace-border);
            border-radius: 8px;
            background: var(--pace-background);
            color: var(--pace-ink);
            font-size: 12px;
            line-height: 1.3;
            white-space: nowrap;
        }
        .current-hole strong {
            padding: 1px 6px;
            border-radius: 7px;
            background: var(--pace-ink);
            color: white;
            font-size: 20px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .gap-track {
            position: relative;
            height: 8px;
            margin: 8px 5px;
            border-radius: 8px;
            background-color: var(--app-track);
            background-image: repeating-linear-gradient(110deg, transparent 0 6px, #ffffff55 6px 10px, transparent 10px 16px);
            background-size: 16px 100%;
        }
        .gap-fill {
            position: absolute;
            top: 0;
            height: 100%;
            border-radius: inherit;
            background-color: #58799f;
            background-image: repeating-linear-gradient(110deg, transparent 0 6px, #ffffff66 6px 10px, transparent 10px 16px);
            background-size: 16px 100%;
        }
        @keyframes gap-flow { from { background-position: 0 0; } to { background-position: 16px 0; } }
        @media (prefers-reduced-motion: no-preference) {
            .hole-progress:not([hidden]) .gap-fill { animation: gap-flow 1s linear infinite; }
            .hole-progress:not([hidden]) .pace-gap:is([data-state="ahead"], [data-state="behind"]) .gap-track { animation: gap-flow 2.5s linear infinite; }
            .pace-gap[data-state="ahead"] .gap-fill { animation-direction: reverse; }
            .hole-progress:not([hidden]) .pace-gap[data-state="ahead"] .gap-track { animation-direction: reverse; }
        }
        .gap-marker { position: absolute; top: 50%; width: 20px; height: 24px; transform: translate(-50%, -50%); }
        .gap-marker svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 1px white); }
        .gap-marker.player { color: var(--brand-navy); z-index: 2; }
        .gap-marker.expected { color: #1e5ba8; z-index: 1; }
        .gap-legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 10px; line-height: 1.3; color: var(--app-muted); }
        .gap-scale { font-variant-numeric: tabular-nums; white-space: nowrap; }
        .gap-legend span { display: inline-flex; align-items: center; gap: 4px; }
        .gap-legend svg { width: 12px; height: 12px; flex: 0 0 12px; color: var(--brand-navy); }
        .gap-legend span:last-child svg { color: #1e5ba8; }
        .icon-definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
        .pace-gap #gap-time, .pace-gap .gap-legend { color: var(--pace-ink); }
        main.showing-progress .swipe-hint { display: none; }
        .time-difference {
            font-weight: bold;
            line-height: 1.4;
        }
        .time-difference.on-time {
            color: var(--brand-navy);
        }
        .time-difference.red {
            color: red;
        }
        table {
            margin-top: 10px;
            border-collapse: collapse;
            width: 100%;
        }
        table, th, td {
            border: 1px solid var(--app-border);
        }

        }
        td{
            background: rgba(255, 255, 255, 0.671);

    <script>
        const teeTimeSelect = document.getElementById('tee-time');
        const holeSelect = document.getElementById('hole');
        const resultDiv = document.getElementById('result');
        const timeDifferenceDiv = document.getElementById('time-difference');
        const menuToggle = document.getElementById('menu-toggle');
        const modeMenu = document.getElementById('mode-menu');
        const modeButtons = Array.from(document.querySelectorAll('.mode-option'));
        const shotgunTimeInput = document.getElementById('shotgun-time');
        const shotgunStartSelect = document.getElementById('shotgun-start-hole');
        let currentMode = 't1';
        let startingHole = 1;
        const resultViewToggle = document.getElementById('result-view-toggle');
        const resultViewButtons = Array.from(document.querySelectorAll('[data-result-view]'));
        const holeProgress = document.getElementById('hole-progress');
        let resultView = 'table';
        let calculation = null;
        const progressDialog = document.getElementById('progress-dialog');
        const progressExpand = document.getElementById('progress-expand');
        const landscapeButton = document.getElementById('progress-landscape');
        let progressPlaceholder = null;
        let enteredDetailFullscreen = false;
        let detailOrientationLocked = false;
        let landscapeRequestId = 0;

        function updateOrientationButton() {
            if (!progressDialog.open) return;
            const horizontal = window.matchMedia('(orientation: landscape)').matches;
            document.getElementById('progress-landscape-label').textContent = horizontal ? 'Ecrã inteiro' : 'Horizontal';
        }

        function openProgressDialog() {
            if (!calculation || resultView !== 'progress' || progressDialog.open) return;
            progressPlaceholder = document.createComment('progress-panel-home');
            holeProgress.before(progressPlaceholder);
            document.getElementById('progress-dialog-panel').append(holeProgress);
            document.getElementById('progress-dialog-mode').textContent = document.getElementById('active-mode').textContent;
            const start = new Date(calculation.schedule[0].start).toTimeString().slice(0, 5);
            document.getElementById('progress-dialog-context').textContent = `Partida ${start} · Fim do buraco ${calculation.selectedHole}`;
            document.documentElement.classList.add('progress-dialog-open');
            progressExpand.setAttribute('aria-expanded', 'true');
            progressDialog.showModal();
            updateOrientationButton();
            document.getElementById('progress-dialog-close').focus({ preventScroll: true });
            refreshResultClock();
        }

        function restoreProgressPanel(restoreFocus) {
            if (!progressPlaceholder) return;
            landscapeRequestId++;
            progressPlaceholder.replaceWith(holeProgress);
            progressPlaceholder = null;
            document.documentElement.classList.remove('progress-dialog-open');
            progressExpand.setAttribute('aria-expanded', 'false');
            landscapeButton.disabled = false;
            if (detailOrientationLocked) {
                try { screen.orientation?.unlock?.(); } catch {}
                detailOrientationLocked = false;
            }
            if (enteredDetailFullscreen && document.fullscreenElement === document.documentElement) {
                document.exitFullscreen().catch(() => {});
            }
            enteredDetailFullscreen = false;
            if (restoreFocus && !holeProgress.hidden) progressExpand.focus({ preventScroll: true });
        }

        function closeProgressDialog(restoreFocus = true) {
            if (progressDialog.open) progressDialog.close();
            restoreProgressPanel(restoreFocus);
        }

        holeProgress.addEventListener('click', openProgressDialog);
        document.getElementById('progress-dialog-close').addEventListener('click', () => closeProgressDialog());
        progressDialog.addEventListener('cancel', event => { event.preventDefault(); closeProgressDialog(); });
        progressDialog.addEventListener('keydown', event => {
            if (event.key !== 'Tab') return;
            const controls = Array.from(progressDialog.querySelectorAll('button:not([disabled])')).filter(button => button.getClientRects().length > 0);
            const first = controls[0];
            const last = controls[controls.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        });
        progressDialog.addEventListener('close', () => { if (!progressDialog.open) restoreProgressPanel(true); });
        progressDialog.addEventListener('click', event => {
            if (event.target !== progressDialog) return;
            const rect = progressDialog.getBoundingClientRect();
            if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closeProgressDialog();
        });
        window.addEventListener('resize', updateOrientationButton);
        landscapeButton.addEventListener('click', async () => {
            const requestId = ++landscapeRequestId;
            landscapeButton.disabled = true;
            try {
                if (document.fullscreenEnabled && !document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                    enteredDetailFullscreen = true;
                }
                if (!progressDialog.open || requestId !== landscapeRequestId) {
                    if (enteredDetailFullscreen && document.fullscreenElement === document.documentElement) await document.exitFullscreen();
                    enteredDetailFullscreen = false;
                    return;
                }
                if (!window.matchMedia('(orientation: landscape)').matches && typeof screen.orientation?.lock === 'function') {
                    await screen.orientation.lock('landscape');
                    detailOrientationLocked = true;
                    if (!progressDialog.open || requestId !== landscapeRequestId) {
                        screen.orientation.unlock();
                        detailOrientationLocked = false;
                    }
                }
            } catch {
                // Manual rotation remains available when fullscreen or locking is unsupported.
            } finally {
                landscapeButton.disabled = false;
                updateOrientationButton();
            }
        });

        const startHour = 8;
        const endHour = 14;
        const incrementMinutes = 10;

        const holeTimes = [
            16, 19, 13, 15, 19, 12, 17, 13, 15, 16, 19, 16, 12, 16, 13, 15, 15, 19
        ];
        // Hole Pace from the supplied Shotgun sheet: 4h40 for all 18 holes.
        // Rotate these durations from the chosen starting hole, then add the start time.
        shotgunStartSelect.replaceChildren(...Array.from(holeSelect.options, option => option.cloneNode(true)));

        for (let hour = startHour; hour <= endHour; hour++) {
            for (let minutes = 0; minutes < 60; minutes += incrementMinutes) {
                if (hour === endHour && minutes > 0) break;
                const time = `${hour.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                const option = document.createElement('option');
                option.value = time;
                option.textContent = time;
                teeTimeSelect.appendChild(option);
            }
        }

        function createSwipeSelector(select, previousLabel, nextLabel) {
            const control = document.createElement('div');
            control.className = 'swipe-selector';

            const previous = document.createElement('button');
            previous.type = 'button';
            previous.className = 'swipe-step';
            previous.textContent = '\u2039';
            previous.setAttribute('aria-label', previousLabel);

            const value = document.createElement('div');
            value.id = `${select.id}-swipe`;
            value.className = 'swipe-value';
            value.tabIndex = 0;
            value.setAttribute('role', 'spinbutton');
            value.setAttribute('aria-labelledby', `${select.id}-label`);
            value.setAttribute('aria-describedby', 'swipe-hint');
            const number = document.createElement('span');
            number.className = 'swipe-number';
            value.append(number);

            const next = document.createElement('button');
            next.type = 'button';
            next.className = 'swipe-step';
            next.textContent = '\u203a';
            next.setAttribute('aria-label', nextLabel);

            function numericValue(option) {
                if (select.id === 'tee-time') {
                    const [hours, minutes] = option.value.split(':').map(Number);
                    return hours * 60 + minutes;
                }
                return Number(option.value);
            }

            function render() {
                const index = select.selectedIndex;
                const option = select.options[index];
                number.textContent = option.textContent;
                const numericOptions = Array.from(select.options, numericValue);
                value.setAttribute('aria-valuemin', Math.min(...numericOptions));
                value.setAttribute('aria-valuemax', Math.max(...numericOptions));
                value.setAttribute('aria-valuenow', numericValue(option));
                value.setAttribute('aria-valuetext', option.textContent);
                previous.disabled = index === 0;
                next.disabled = index === select.options.length - 1;
            }

            function choose(index) {
                const boundedIndex = Math.max(0, Math.min(select.options.length - 1, index));
                if (boundedIndex === select.selectedIndex) return;
                select.selectedIndex = boundedIndex;
                select.dispatchEvent(new Event('change', { bubbles: true }));
            }

            const pixelsPerStep = 22;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            const clamp = position => Math.max(0, Math.min(select.options.length - 1, position));
            let momentumFrame = 0;
            let gesture = null;

            function stopMotion() {
                cancelAnimationFrame(momentumFrame);
                momentumFrame = 0;
                value.classList.remove('is-dragging');
                number.style.transform = '';
            }

            function showPosition(position) {
                choose(Math.round(position));
                if (!reducedMotion.matches) {
                    number.style.transform = `translateX(${(select.selectedIndex - position) * pixelsPerStep * 0.5}px)`;
                }
            }

            function stepBy(delta) {
                stopMotion();
                choose(select.selectedIndex + delta);
            }

            previous.addEventListener('click', () => stepBy(-1));
            next.addEventListener('click', () => stepBy(1));
            select.addEventListener('change', render);
            value.addEventListener('keydown', event => {
                const steps = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 };
                if (event.key in steps) {
                    event.preventDefault();
                    stepBy(steps[event.key]);
                } else if (event.key === 'Home' || event.key === 'End') {
                    event.preventDefault();
                    stopMotion();
                    choose(event.key === 'Home' ? 0 : select.options.length - 1);
                }
            });

            value.addEventListener('pointerdown', event => {
                if (!event.isPrimary || event.button !== 0) return;
                stopMotion();
                gesture = {
                    id: event.pointerId, x: event.clientX, y: event.clientY,
                    lastX: event.clientX, time: event.timeStamp,
                    position: select.selectedIndex, velocity: 0, dragging: false
                };
                value.setPointerCapture(event.pointerId);
            });

            value.addEventListener('pointermove', event => {
                if (!gesture || gesture.id !== event.pointerId) return;
                if (!gesture.dragging) {
                    const dx = event.clientX - gesture.x;
                    const dy = event.clientY - gesture.y;
                    if (Math.abs(dx) < 6 || Math.abs(dx) <= Math.abs(dy)) return;
                    gesture.dragging = true;
                    value.classList.add('is-dragging');
                }
                const elapsed = Math.max(1, event.timeStamp - gesture.time);
                const position = clamp(gesture.position - (event.clientX - gesture.lastX) / pixelsPerStep);
                gesture.velocity = gesture.velocity * 0.4 + (position - gesture.position) / elapsed * 0.6;
                gesture.position = position;
                gesture.lastX = event.clientX;
                gesture.time = event.timeStamp;
                showPosition(position);
            });

            value.addEventListener('pointerup', event => {
                if (!gesture || gesture.id !== event.pointerId) return;
                const finished = gesture;
                gesture = null;
                if (!finished.dragging) return;
                const recentFlick = event.timeStamp - finished.time < 100
                    && Math.abs(event.clientX - finished.x) >= 14
                    && Math.abs(finished.velocity) > 0.01;
                const coast = recentFlick && !reducedMotion.matches
                    ? Math.max(-2, Math.min(2, finished.velocity * 90)) : 0;
                const target = Math.round(clamp(finished.position + coast));
                if (!coast || target === select.selectedIndex) {
                    choose(target);
                    stopMotion();
                    return;
                }

                const started = performance.now();
                function settle(now) {
                    const progress = Math.min(1, (now - started) / 180);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    showPosition(finished.position + (target - finished.position) * ease);
                    if (progress < 1) momentumFrame = requestAnimationFrame(settle);
                    else stopMotion();
                }
                momentumFrame = requestAnimationFrame(settle);
            });
            value.addEventListener('pointercancel', () => {
                gesture = null;
                stopMotion();
            });
            value.addEventListener('lostpointercapture', () => {
                if (!gesture) return;
                gesture = null;
                stopMotion();
            });

            control.append(previous, value, next);
            select.after(control);
            select.hidden = true;
            document.getElementById(`${select.id}-label`).addEventListener('click', event => {
                event.preventDefault();
                value.focus();
            });
            render();
            return { refresh() { gesture = null; stopMotion(); render(); } };
        }

        createSwipeSelector(teeTimeSelect, 'Tee time anterior: menos 10 minutos', 'Tee time seguinte: mais 10 minutos');
        const holeControl = createSwipeSelector(holeSelect, 'Buraco anterior', 'Buraco seguinte');
        createSwipeSelector(shotgunStartSelect, 'Buraco de saída anterior', 'Buraco de saída seguinte');
        document.getElementById('swipe-hint').hidden = false;

        function getHoleOrder() {
            return Array.from({ length: holeTimes.length }, (_, index) => (startingHole - 1 + index) % holeTimes.length + 1);
        }

        function resetCourse() {
            holeSelect.replaceChildren(...getHoleOrder().map(hole => new Option(String(hole), String(hole))));
            holeControl.refresh();
            calculateEndTime();
        }

        shotgunStartSelect.addEventListener('change', () => {
            if (currentMode !== 'shotgun') return;
            startingHole = Number(shotgunStartSelect.value);
            resetCourse();
        });
        shotgunTimeInput.addEventListener('input', calculateEndTime);
        shotgunTimeInput.addEventListener('change', calculateEndTime);

        function setMenuOpen(open, restoreFocus = false) {
            modeMenu.hidden = !open;
            menuToggle.setAttribute('aria-expanded', String(open));
            if (open) modeMenu.querySelector('[aria-pressed="true"]').focus();
            else if (restoreFocus) menuToggle.focus();
        }

        menuToggle.addEventListener('click', () => setMenuOpen(modeMenu.hidden));
        document.addEventListener('click', event => {
            if (!event.target.closest('.app-header')) setMenuOpen(false);
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !modeMenu.hidden) {
                event.preventDefault();
                setMenuOpen(false, true);
            }
        });
        modeButtons.forEach(button => button.addEventListener('click', () => {
            const selectedMode = button.dataset.mode;
            if (currentMode !== selectedMode) {
                currentMode = selectedMode;
                const isShotgun = currentMode === 'shotgun';
                startingHole = Number(isShotgun ? shotgunStartSelect.value : button.dataset.startHole);
                document.getElementById('tee-time-field').hidden = isShotgun;
                document.getElementById('shotgun-time-field').hidden = !isShotgun;
                document.getElementById('shotgun-start-field').hidden = !isShotgun;
                document.querySelector('.selectors').classList.toggle('is-shotgun', isShotgun);
                document.querySelector('main').classList.toggle('shotgun-mode', isShotgun);
                document.getElementById('hole-label').textContent = isShotgun ? 'Buraco atual' : 'Buraco';
                document.getElementById('active-mode').textContent = isShotgun ? 'Shotgun' : `Saída do T${startingHole}`;
                modeButtons.forEach(option => option.setAttribute('aria-pressed', String(option === button)));
                resetCourse();
            }
            setMenuOpen(false, true);
        }));

        function getExpectedProgress(schedule, now) {
            const first = schedule[0];
            const last = schedule[schedule.length - 1];
            if (now < first.start) return { ...first, state: 'waiting', percentage: 0 };
            if (now >= last.end) return { ...last, state: 'complete', percentage: 100 };
            const current = schedule.find(segment => now < segment.end);
            return { ...current, state: 'playing', percentage: (now - current.start) / (current.end - current.start) * 100 };
        }

        function applyResultView() {
            const hasResult = calculation !== null;
            if (!hasResult || resultView !== 'progress') closeProgressDialog(false);
            resultViewToggle.hidden = !hasResult;
            document.getElementById('hole-times-table').style.display = hasResult && resultView === 'table' ? 'table' : 'none';
            holeProgress.hidden = !hasResult || resultView !== 'progress';
            document.querySelector('main').classList.toggle('showing-progress', hasResult && resultView === 'progress');
            resultViewButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.resultView === resultView)));
        }

        resultViewButtons.forEach(button => button.addEventListener('click', () => {
            resultView = button.dataset.resultView;
            refreshResultClock();
            applyResultView();
        }));

        function getPaceGap(schedule, selectedHole, now) {
            const start = schedule[0].start;
            const finish = schedule[schedule.length - 1].end;
            const player = schedule.find(segment => segment.hole === selectedHole).end;
            const frontNine = selectedHole <= 9;
            const firstHole = frontNine ? 1 : 10;
            const lastHole = frontNine ? 9 : 18;
            const minutesBeforePlayer = holeTimes.slice(firstHole - 1, selectedHole).reduce((total, minutes) => total + minutes, 0);
            const scaleMinutes = holeTimes.slice(firstHole - 1, lastHole).reduce((total, minutes) => total + minutes, 0);
            // Anchor this physical half to the selected hole's occurrence in T1, T10 or Shotgun order.
            const scaleStart = player - minutesBeforePlayer * 60000;
            const scaleEnd = scaleStart + scaleMinutes * 60000;
            const scale = { scaleStartHole: frontNine ? 1 : 9, scaleEndHole: lastHole, scaleMinutes };
            if (now < start) return { ...scale, milliseconds: 0, playerPercent: 0, expectedPercent: 0, waiting: true, expectedOffscale: null };
            const expected = Math.max(start, Math.min(finish, now));
            const toPercent = timestamp => Math.max(0, Math.min(100, (timestamp - scaleStart) / (scaleEnd - scaleStart) * 100));
            return {
                ...scale,
                milliseconds: expected - player,
                playerPercent: toPercent(player),
                expectedPercent: toPercent(expected),
                waiting: false,
                expectedOffscale: expected < scaleStart ? 'before' : expected > scaleEnd ? 'after' : null
            };
        }

        function refreshResultClock(now = Date.now()) {
            if (!calculation) return;
            if (calculation.day !== new Date(now).toDateString()) {
                calculateEndTime();
                return;
            }
            const selected = calculation.schedule.find(segment => segment.hole === calculation.selectedHole);
            const timeDifference = now - selected.end;
            const absTimeDifference = Math.abs(timeDifference);
            const hoursDifference = Math.floor(absTimeDifference / 3600000);
            const minutesDifference = Math.floor(absTimeDifference % 3600000 / 60000);
            const isLate = timeDifference > 0;
            timeDifferenceDiv.innerHTML = `${isLate ? 'Atrasado: +' : 'A horas: -'} <span>${hoursDifference}h${minutesDifference}m</span>`;
            timeDifferenceDiv.classList.toggle('red', isLate);
            timeDifferenceDiv.classList.toggle('on-time', !isLate);
            const selectedCell = document.querySelector('[data-selected-hole-time]');
            if (selectedCell) selectedCell.style.color = isLate ? 'red' : 'var(--brand-navy)';

            const progress = getExpectedProgress(calculation.schedule, now);
            const percentage = Math.floor(progress.percentage);
            const formatTime = timestamp => new Date(timestamp).toTimeString().slice(0, 5);
            document.getElementById('progress-caption').textContent = progress.state === 'waiting' ? 'Ainda não começou'
                : progress.state === 'complete' ? 'A volta já deveria estar concluída' : 'Onde deveria estar agora';
            document.getElementById('progress-hole-prefix').textContent = progress.state === 'complete' ? 'Volta concluída' : 'Buraco ';
            const expectedHoleNumber = document.getElementById('progress-expected-hole');
            expectedHoleNumber.hidden = progress.state === 'complete';
            expectedHoleNumber.textContent = expectedHoleNumber.hidden ? '' : String(progress.hole);
            document.getElementById('progress-percent').textContent = `${percentage}%`;
            document.getElementById('progress-fill').style.width = `${progress.percentage}%`;
            const track = document.getElementById('progress-track');
            track.setAttribute('aria-valuenow', String(Math.round(progress.percentage * 10) / 10));
            track.setAttribute('aria-valuetext', `${progress.state === 'complete' ? 'Volta concluída' : `Buraco ${progress.hole}`}: ${percentage}%`);
            document.getElementById('progress-start').textContent = progress.state === 'complete' ? `Último buraco: ${progress.hole}`
                : progress.state === 'waiting' ? 'Aguardar partida' : `Entrada: ${formatTime(progress.start)}`;
            document.getElementById('progress-end').textContent = `${progress.state === 'waiting' ? 'Partida' : 'Término'}: ${formatTime(progress.state === 'waiting' ? progress.start : progress.end)}`;

            const gap = getPaceGap(calculation.schedule, calculation.selectedHole, now);
            const gapMinutes = Math.floor((isLate ? absTimeDifference : Math.abs(gap.milliseconds)) / 60000);
            const durationLabel = gapMinutes === 0 ? '<1 min' : gapMinutes >= 60 ? `${Math.floor(gapMinutes / 60)}h ${gapMinutes % 60}m` : `${gapMinutes} min`;
            const gapText = gap.waiting ? 'Aguardar partida' : isLate ? `Atrasado ${durationLabel}`
                : gap.milliseconds < 0 ? `${durationLabel} de avanço` : 'Em linha';
            document.getElementById('pace-gap').dataset.state = gap.waiting ? 'waiting' : gap.milliseconds > 0 ? 'behind' : gap.milliseconds < 0 ? 'ahead' : 'on-time';
            document.getElementById('pace-gap').dataset.timing = isLate ? 'late' : 'on-time';
            document.getElementById('gap-time').textContent = gapText;
            document.getElementById('progress-current-hole').textContent = String(calculation.selectedHole);
            document.getElementById('gap-reference').textContent = `Fim do B${calculation.selectedHole}`;
            document.getElementById('gap-scale').textContent = `${gap.scaleStartHole}–${gap.scaleEndHole}`;
            document.getElementById('gap-expected-label').textContent = gap.expectedOffscale
                ? `${gap.expectedOffscale === 'before' ? '← ' : ''}Previsto B${progress.hole}${gap.expectedOffscale === 'after' ? ' →' : ''}` : 'Previsto';
            document.getElementById('gap-expected').dataset.offscale = gap.expectedOffscale || '';
            document.getElementById('gap-player').style.left = `${gap.playerPercent}%`;
            document.getElementById('gap-expected').style.left = `${gap.expectedPercent}%`;
            document.getElementById('gap-fill').style.left = `${Math.min(gap.playerPercent, gap.expectedPercent)}%`;
            document.getElementById('gap-fill').style.width = `${Math.abs(gap.playerPercent - gap.expectedPercent)}%`;
            document.getElementById('gap-track').setAttribute('aria-label', `${gapText}. Referência: término do buraco ${calculation.selectedHole}. Escala: buracos ${gap.scaleStartHole} a ${gap.scaleEndHole}.${gap.expectedOffscale ? ` A posição prevista no buraco ${progress.hole} está fora desta faixa.` : ''}`);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) calculateEndTime();
        });

        function calculateEndTime() {
            if (currentMode === 'shotgun' && !shotgunTimeInput.validity.valid) {
                showInvalidTime();
                return;
            }
            resultDiv.textContent = '';
            const teeTime = currentMode === 'shotgun' ? shotgunTimeInput.value : teeTimeSelect.value;
            const hole = parseInt(holeSelect.value);

            const [hour, minute] = teeTime.split(':').map(Number);
            const teeTimeDate = new Date();
            teeTimeDate.setHours(hour, minute, 0, 0);

            const holeTimesTable = document.getElementById('hole-times-table');
            const tbody = holeTimesTable.querySelector('tbody');
            tbody.innerHTML = ''; // Clear previous results

            const holeOrder = getHoleOrder();
            let nextStart = teeTimeDate.getTime();
            const schedule = holeOrder.map(holeNumber => {
                const segment = { hole: holeNumber, start: nextStart, end: nextStart + holeTimes[holeNumber - 1] * 60000 };
                nextStart = segment.end;
                return segment;
            });
            const selectedIndex = schedule.findIndex(segment => segment.hole === hole);
            const holesToShow = schedule.slice(Math.max(0, selectedIndex - 1), selectedIndex + 2);

            holesToShow.forEach(segment => {
                const h = segment.hole;
                const endTimeDate = new Date(segment.end);
                const endTime = endTimeDate.toTimeString().slice(0, 5);

                const row = document.createElement('tr');
                const holeCell = document.createElement('td');
                const timeCell = document.createElement('td');

                holeCell.textContent = h;
                timeCell.textContent = endTime;

                if (h === hole) {
                    timeCell.dataset.selectedHoleTime = '';
                }

                row.appendChild(holeCell);
                row.appendChild(timeCell);
                tbody.appendChild(row);
            });

            calculation = { schedule, selectedHole: hole, day: teeTimeDate.toDateString() };
            refreshResultClock();
            applyResultView();
        }

        function showInvalidTime() {
            calculation = null;
            resultDiv.textContent = 'Indica uma hora de partida válida.';
            timeDifferenceDiv.textContent = '';
            timeDifferenceDiv.classList.remove('red', 'on-time');
            const holeTimesTable = document.getElementById('hole-times-table');
            holeTimesTable.style.display = 'none';
            holeTimesTable.querySelector('tbody').innerHTML = '';
            applyResultView();
        }

        teeTimeSelect.addEventListener('change', calculateEndTime);
        holeSelect.addEventListener('change', calculateEndTime);
        calculateEndTime();
        setInterval(refreshResultClock, 1000);
    </script>
    <script src="account-sync.js" defer></script>
